<!DOCTYPE html>
<html lang="es" data-theme="claro" data-font="sans">
<head>
  <meta charset="utf-8">
  <!-- Zoom is never disabled: people with low vision need pinch-zoom. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Biblia — Reina-Valera 1909</title>
  <meta name="description" content="Lea y escuche la Biblia Reina-Valera 1909 con letra grande. Funciona sin internet.">
  <meta name="theme-color" content="#FAF7F0">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Biblia">
  <link rel="preload" href="fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply saved settings before first paint so the page never flashes the wrong size/colors.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('biblia.ajustes') || '{}');
        var r = document.documentElement;
        if (s.size) r.style.setProperty('--text-scale', String(s.size / 16));
        if (s.theme) r.setAttribute('data-theme', s.theme);
        if (s.font) r.setAttribute('data-font', s.font);
      } catch (e) { /* storage blocked: use defaults */ }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <header class="app-header">
    <a class="btn btn-back" id="back-btn" href="#/libros" hidden>
      <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
      <span>Volver</span>
    </a>
    <p class="app-title" id="app-title">Biblia</p>
  </header>

  <main id="main" class="content" tabindex="-1">
    <p class="loading">Cargando…</p>
    <noscript>
      <p>Para usar esta aplicación, active JavaScript en su navegador.</p>
    </noscript>
  </main>

  <nav class="bottom-bar" id="bottom-bar" aria-label="Menú principal">
    <a class="bar-btn" href="#/libros" data-nav="libros">
      <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5c-.8 0-1.5-.7-1.5-1.5zM13 4h5.5c.8 0 1.5.7 1.5 1.5v13c0 .8-.7 1.5-1.5 1.5H13z" /></svg>
      <span>Libros</span>
    </a>
    <button class="bar-btn bar-mic" type="button" id="btn-hablar">
      <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" /></svg>
      <span>Hablar</span>
    </button>
    <a class="bar-btn" href="#/marcadores" data-nav="marcadores">
      <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M7 3.5h10c.6 0 1 .4 1 1V21l-6-4-6 4V4.5c0-.6.4-1 1-1z" /></svg>
      <span>Marcadores</span>
    </a>
    <a class="bar-btn" href="#/ajustes" data-nav="ajustes">
      <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" /><circle cx="16" cy="7" r="2.2" /><circle cx="10" cy="17" r="2.2" /></svg>
      <span>Ajustes</span>
    </a>
  </nav>

  <!-- Full-screen voice search panel. Content is filled in by app.js. -->
  <dialog class="voice-panel" id="voice-panel" aria-labelledby="voice-title">
    <div class="voice-inner" id="voice-inner"></div>
  </dialog>

  <!-- Confirmation / information dialog (never closes by itself). -->
  <dialog class="dialog" id="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-body">
    <form method="dialog" class="dialog-form">
      <h2 id="dialog-title"></h2>
      <p id="dialog-body"></p>
      <div class="dialog-actions" id="dialog-actions"></div>
    </form>
  </dialog>

  <!-- Screen-reader announcements -->
  <div class="visually-hidden" id="announcer" aria-live="polite" aria-atomic="true"></div>

  <script src="js/config.js"></script>
  <script src="js/books.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
